name: AuraLock Release CI/CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (.deb, .rpm, .AppImage, .zip)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev libdbus-1-dev pkg-config dpkg-dev rpm alien zip wget file

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust Release Binaries
        run: |
          cargo build --release

      - name: Package .deb, .rpm, and .AppImage
        run: |
          chmod +x scripts/build-deb.sh scripts/build-rpm.sh scripts/build-appimage.sh scripts/package-release.sh
          mkdir -p dist dist-linux
          
          # 1. Build .deb
          ./scripts/build-deb.sh
          cp dist/*.deb dist-linux/
          
          # 2. Build .rpm
          ./scripts/build-rpm.sh
          cp dist/*.rpm dist-linux/
          
          # 3. Build .AppImage
          ./scripts/build-appimage.sh || true
          cp dist/*.AppImage dist-linux/ || true
          
          # 4. Create Universal Linux ZIP Bundle
          mkdir -p auralock-linux-bundle
          cp target/release/auralock auralock-linux-bundle/
          cp target/release/libpam_auralock.so auralock-linux-bundle/
          cp scripts/install-pam.sh auralock-linux-bundle/
          cp scripts/auralock.service auralock-linux-bundle/
          cp README.md auralock-linux-bundle/
          
          zip -r dist-linux/auralock-v1.0.0-linux-x86_64.zip auralock-linux-bundle
          tar -czvf dist-linux/auralock-v1.0.0-linux-x86_64.tar.gz auralock-linux-bundle

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auralock-linux
          path: dist-linux/*

  build-windows:
    name: Build Windows (.exe setup, .msi, .zip)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Inno Setup & WiX
        shell: pwsh
        run: |
          choco install innosetup --no-progress
          dotnet tool install --global wix --version 4.0.5 || true

      - name: Build Windows Release Binaries
        shell: pwsh
        run: |
          cargo build --release
          mkdir -p dist-win
          copy target\release\auralock.exe dist-win\auralock.exe
          if (Test-Path "target\release\auralock_cp.dll") {
            copy target\release\auralock_cp.dll dist-win\auralock_cp.dll
          }

      - name: Build Inno Setup (.exe installer)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" scripts\windows-installer.iss
          if (Test-Path "dist\auralock_1.0.0_x64-setup.exe") {
            copy dist\auralock_1.0.0_x64-setup.exe dist-win\auralock_1.0.0_x64-setup.exe
          }

      - name: Build Windows MSI (.msi package)
        shell: pwsh
        run: |
          if (Get-Command wix -ErrorAction SilentlyContinue) {
            wix build scripts\windows-installer.wxs -o dist-win\auralock_1.0.0_x64_en-US.msi
          } else {
            # Fallback: create zip bundle as archive
            Compress-Archive -Path dist-win\* -DestinationPath dist-win\auralock-windows-x86_64.zip
          }
          Compress-Archive -Path dist-win\* -DestinationPath dist-win\auralock-windows-x86_64.zip -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auralock-windows
          path: dist-win/*

  build-android:
    name: Build Android App (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        working-directory: mobile/android-app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK Artifact
        run: |
          mkdir -p dist-apk
          cp mobile/android-app/app/build/outputs/apk/debug/app-debug.apk dist-apk/auralock-android-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: auralock-android-apk
          path: dist-apk/*

  publish-release:
    name: Publish GitHub Release (Multi-Asset)
    needs: [build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: auralock-linux
          path: release-assets/

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: auralock-windows
          path: release-assets/

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: auralock-android-apk
          path: release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AuraLock ${{ github.ref_name }} (msm.movin)"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*
            scripts/install-pam.sh
            scripts/auralock.service
