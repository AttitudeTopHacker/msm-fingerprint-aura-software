name: AuraLock Release CI/CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux .deb, PAM Module & Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev libdbus-1-dev pkg-config dpkg-dev zip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binaries & .deb Package
        run: |
          chmod +x scripts/build-deb.sh scripts/package-release.sh
          cargo build --release
          ./scripts/build-deb.sh
          
          mkdir -p dist-linux
          cp dist/*.deb dist-linux/ || true
          cp target/release/auralock dist-linux/auralock-linux-x86_64
          cp target/release/libpam_auralock.so dist-linux/libpam_auralock.so
          
          # Create universal tar.gz
          mkdir -p auralock-linux-bundle
          cp target/release/auralock auralock-linux-bundle/
          cp target/release/libpam_auralock.so auralock-linux-bundle/
          cp scripts/install-pam.sh auralock-linux-bundle/
          cp scripts/auralock.service auralock-linux-bundle/
          cp README.md auralock-linux-bundle/
          tar -czvf dist-linux/auralock-linux-x86_64.tar.gz auralock-linux-bundle

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auralock-linux
          path: dist-linux/*

  build-windows:
    name: Build Windows Binaries (.exe & DLL)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows Release Binaries
        run: |
          cargo build --release
          mkdir dist-win
          copy target\release\auralock.exe dist-win\auralock-windows-x86_64.exe
          if (Test-Path "target\release\auralock_cp.dll") {
            copy target\release\auralock_cp.dll dist-win\auralock_cp.dll
          }
          Compress-Archive -Path dist-win\* -DestinationPath dist-win\auralock-windows-x86_64.zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auralock-windows
          path: dist-win/*

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        working-directory: mobile/android-app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK Artifact
        run: |
          mkdir -p dist-apk
          cp mobile/android-app/app/build/outputs/apk/debug/app-debug.apk dist-apk/auralock-android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: auralock-android-apk
          path: dist-apk/*

  publish-release:
    name: Publish GitHub Release (.deb, .exe, .zip, .apk)
    needs: [build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: auralock-linux
          path: release-assets/

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: auralock-windows
          path: release-assets/

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: auralock-android-apk
          path: release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AuraLock ${{ github.ref_name }} (msm.movin)"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*
            scripts/install-pam.sh
            scripts/auralock.service
