name: AuraLock Release CI/CD

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.3.3)'
        required: false
        default: 'v1.3.3'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (.deb, .rpm, .AppImage, .zip)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev libdbus-1-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libgtk-3-dev pkg-config dpkg-dev rpm alien zip wget file

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust Release Binaries
        run: |
          cargo build --release --package auralock-desktop --package auralock-cli --package auralock-pam

      - name: Package Linux Installers (.deb, .rpm, .AppImage, .zip)
        run: |
          chmod +x scripts/*.sh
          mkdir -p dist dist-linux
          
          # 1. Build .deb package
          ./scripts/build-deb.sh
          cp dist/*.deb dist-linux/ || true
          
          # 2. Build .rpm package
          ./scripts/build-rpm.sh || true
          cp dist/*.rpm dist-linux/ || true
          
          # 3. Build .AppImage package
          ./scripts/build-appimage.sh || true
          cp dist/*.AppImage dist-linux/ || true
          
          # 4. Universal Linux ZIP Bundle
          mkdir -p auralock-linux-bundle
          cp target/release/auralock-desktop auralock-linux-bundle/auralock || cp target/release/auralock auralock-linux-bundle/
          if [ -f target/release/libpam_auralock.so ]; then
            cp target/release/libpam_auralock.so auralock-linux-bundle/
          fi
          cp scripts/install-pam.sh auralock-linux-bundle/
          cp scripts/auralock.service auralock-linux-bundle/
          cp README.md auralock-linux-bundle/
          
          VERSION=$(tr -d '\r\n' < VERSION 2>/dev/null || echo "1.3.3")
          zip -r "dist-linux/auralock-v${VERSION}-linux-x86_64.zip" auralock-linux-bundle
          tar -czvf "dist-linux/auralock-v${VERSION}-linux-x86_64.tar.gz" auralock-linux-bundle

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auralock-linux
          path: dist-linux/*

  build-windows:
    name: Build Windows (.exe setup, .zip)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows Release Binaries
        shell: pwsh
        run: |
          cargo build --release --package auralock-cli --package auralock-cp
          New-Item -ItemType Directory -Force -Path dist-win
          Copy-Item target\release\auralock.exe dist-win\auralock.exe
          if (Test-Path "target\release\auralock_cp.dll") {
            Copy-Item target\release\auralock_cp.dll dist-win\auralock_cp.dll
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress

      - name: Build Inno Setup (.exe installer)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" scripts\windows-installer.iss
          } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files\Inno Setup 6\ISCC.exe" scripts\windows-installer.iss
          } else {
            iscc scripts\windows-installer.iss
          }
          if (Test-Path "dist\auralock_*_x64-setup.exe") {
            Get-ChildItem -Path dist\auralock_*_x64-setup.exe | Copy-Item -Destination dist-win\
          }

      - name: Package Windows ZIP Bundle
        shell: pwsh
        run: |
          Compress-Archive -Path dist-win\* -DestinationPath dist-win\auralock-windows-x86_64.zip -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auralock-windows
          path: dist-win/*

  build-android:
    name: Build Android App (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Android APK
        working-directory: mobile/android-app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Artifact
        run: |
          mkdir -p dist-apk
          VERSION=$(tr -d '\r\n' < VERSION 2>/dev/null || echo "1.3.3")
          cp mobile/android-app/app/build/outputs/apk/debug/app-debug.apk "dist-apk/auralock-android-v${VERSION}.apk"
          cp mobile/android-app/app/build/outputs/apk/debug/app-debug.apk dist-apk/auralock-android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: auralock-android-apk
          path: dist-apk/*

  publish-release:
    name: Publish GitHub Release (Multi-Asset)
    if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    needs: [build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Display Downloaded Assets
        run: |
          echo "=== 📦 Release Assets Found ==="
          ls -la release-assets/ || true
          find release-assets -type f || true

      - name: Determine Release Tag
        id: tag_info
        run: |
          VERSION=$(tr -d '\r\n' < VERSION 2>/dev/null || echo "1.3.3")
          if [ -n "${{ inputs.tag_name }}" ]; then
            echo "TAG=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=v${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AuraLock ${{ steps.tag_info.outputs.TAG }} (msm.movin)"
          tag_name: ${{ steps.tag_info.outputs.TAG }}
          draft: false
          prerelease: false
          make_latest: "true"
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release-assets/*
            scripts/install-pam.sh
            scripts/auralock.service
            scripts/uninstall.sh

