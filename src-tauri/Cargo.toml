[package]
name = "auralock-desktop"
version = "0.1.0"
description = "AuraLock Biometric Security & AuraDrop Desktop App"
authors = ["msm.movin"]
license = "Proprietary"
repository = "https://github.com/AttitudeTopHacker/msm-fingerprint-aura-software"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
auralock-core = { path = "../crates/auralock-core" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
hostname = { workspace = true }
local-ip-address = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
open = { workspace = true }
dirs = "5"

[features]
custom-protocol = ["tauri/custom-protocol"]

